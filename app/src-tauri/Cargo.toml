[package]
name = "voxbridge"
description = "VoxBridge —— 实时语音翻译（装配层）"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "voxbridge"

# 二进制名带 _lib 后缀是 Tauri 模板的约定，避免和 crate 名冲突。
[lib]
name = "voxbridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# 打包时必须开。开了 Tauri 才用自定义协议读嵌进二进制的前端资源；
# 不开的话即使是 release 构建，窗口也会去连 devUrl（127.0.0.1:5183），
# 用户装上打开就是一片"无法访问此页面"。
# `cargo tauri build` 会自动带上这个 feature，手工 `cargo build --release`
# 不会——所以手工出包务必加 `--features custom-protocol`。
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
vox-core.workspace = true
vox-dsp.workspace = true
vox-net = { path = "../../crates/vox-net" }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot.workspace = true
tokio.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

# 装配层只在 Windows 上构建：音频、热键、悬浮窗三样全是 Win32 实现，
# 没有别的平台的等价物，硬造一层 cfg 假实现只会掩盖问题。
vox-audio-win = { path = "../../crates/vox-audio-win" }
vox-input-win = { path = "../../crates/vox-input-win" }
vox-overlay-win = { path = "../../crates/vox-overlay-win" }
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    # MessageBoxW：启动失败时唯一能让用户看见原因的手段。
    # 发布构建是 windows_subsystem="windows"，stderr 直接进黑洞。
    "Win32_UI_WindowsAndMessaging",
] }
